[workspace]
members = [
    "book-examples/leptos",
    "packages/leptos/*",
    "packages/registry",
    "packages/shadcn",
    "scripts",
]
exclude = ["book-examples/yew", "packages/yew"]
resolver = "2"

[workspace.package]
authors = ["Rust for Web <info@rustforweb.org>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/nicholas-johnson/shadcn-ui"
version = "0.0.1"

[workspace.dependencies]
anyhow = "1.0.89"
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
env_logger = "0.11.3"
leptos = "0.8.23"
leptos-node-ref = "0.2.0"
leptos-struct-component = "0.2.0"
leptos-style = "0.2.0"
leptos_router = "0.8.17"
log = "0.4.21"
lucide-leptos = "2.0.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tailwind_fuse = { version = "0.3.0", features = ["variant"] }
tokio = { version = "1.38.0", features = ["full"] }
